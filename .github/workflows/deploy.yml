name: Deploy to server

on:
  push:
    branches:
      - main

# Avoid two deploys racing if pushes land in quick succession.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and run update.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 15m
          script: |
            [ -x /usr/local/bin/uv ] || cp /root/.local/bin/uv /usr/local/bin/uv
            su -s /bin/bash www -c '
              cd /www/wwwroot/OutcomeOriented-HRMS-FOR-STARTUPS &&
              git fetch --quiet origin main &&
              git reset --hard --quiet origin/main &&
              bash deploy/update-aapanel-manual.sh
            '
